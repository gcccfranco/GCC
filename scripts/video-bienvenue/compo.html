<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<style>
@font-face{font-family:"HanS";src:url("../../public/fonts/SourceHanSansCN-Medium.otf")}
:root{--ink:#1c1c1e;--muted:#6c6c72;--brand:#cf2a20;--chord:#3f63cf}
html,body{margin:0;width:1080px;height:1080px;overflow:hidden;background:#fff}
#stage{position:absolute;inset:0;overflow:hidden;font-family:Inter,"HanS",sans-serif;color:var(--ink);
  background:#f6f6f7}
.halo{position:absolute;border-radius:50%;filter:blur(90px)}
.abs{position:absolute}
.cap{position:absolute;left:60px;right:60px;top:86px;text-align:center;font-weight:700;font-size:70px;
  line-height:1.08;letter-spacing:-0.025em}
.cap .zh{font-family:"HanS";font-weight:500;letter-spacing:0}
.phone{position:absolute;background:#1c1c1e;border-radius:70px;padding:14px;box-shadow:0 40px 90px rgba(28,28,30,.22),0 4px 12px rgba(28,28,30,.12)}
.screen{position:relative;overflow:hidden;border-radius:56px;background:#fff}
.card{position:absolute;overflow:hidden;border-radius:40px;background:#fff;box-shadow:0 30px 80px rgba(28,28,30,.16),0 2px 6px rgba(28,28,30,.08)}
img{display:block}
.ripple{position:absolute;border-radius:50%;border:6px solid var(--chord);box-sizing:border-box}
.chip{position:absolute;padding:14px 28px;border-radius:999px;background:var(--ink);color:#fff;font-weight:700;font-size:40px;white-space:nowrap}
</style></head>
<body><div id="stage">
  <div class="halo" id="h1" style="width:760px;height:620px;background:rgba(207,42,32,.20)"></div>
  <div class="halo" id="h2" style="width:760px;height:620px;background:rgba(63,99,207,.20)"></div>

  <!-- S1 -->
  <div id="s1" class="abs" style="inset:0">
    <img id="s1logo" src="../../public/logo.png" class="abs" style="width:240px;height:240px;left:420px;top:230px;border-radius:50%;box-shadow:0 18px 50px rgba(207,42,32,.25)">
    <div id="s1t" class="abs" style="left:0;right:0;top:540px;text-align:center;font-weight:700;font-size:96px;letter-spacing:-0.03em">Bienvenue dans GCC</div>
    <div id="s1s" class="abs" style="left:0;right:0;top:672px;text-align:center;font-weight:500;font-size:56px;color:var(--muted);letter-spacing:-0.015em">L'app de l'église.</div>
  </div>

  <!-- S2 : liste -->
  <div id="s2" class="abs" style="inset:0">
    <div class="cap" id="s2c">Tous les chants, en français et&nbsp;en&nbsp;<span class="zh">中文</span>.</div>
    <div class="phone" id="s2p" style="left:240px;width:572px">
      <div class="screen" style="height:1238px">
        <img id="s2img" src="shots/01-liste-full.png" class="abs" style="width:572px;left:0;top:0">
        <img src="shots/01-liste.png" class="abs" style="width:572px;left:0;top:0;clip-path:inset(0 0 calc(100% - 92px) 0)">
      </div>
    </div>
  </div>

  <!-- S3 : tonalité -->
  <div id="s3" class="abs" style="inset:0">
    <div class="cap" id="s3c">Dans ta tonalité, en&nbsp;un&nbsp;geste.</div>
    <div class="card" id="s3card" style="left:160px;top:250px;width:760px;height:800px">
      <div id="s3zoom" class="abs" style="left:0;top:0;width:760px;height:800px;transform-origin:0 0">
        <img id="s3a" src="shots/02-chant.png" class="abs" style="width:760px;left:0;top:-100px">
        <img id="s3b" src="shots/03-chant-plus1.png" class="abs" style="width:760px;left:0;top:-100px;opacity:0">
        <div class="ripple" id="s3r"></div>
      </div>
      <div class="chip" id="s3chip">+1 demi-ton</div>
    </div>
  </div>

  <!-- S4 : jianpu -->
  <div id="s4" class="abs" style="inset:0">
    <div class="cap" id="s4c">Les partitions <span class="zh">简谱</span>, transposées sur le&nbsp;scan.</div>
    <div class="card" id="s4card" style="left:150px;top:300px;width:780px;height:760px">
      <img id="s4img" src="shots/04-jianpu-page.png" class="abs" style="width:780px;left:0;top:0">
    </div>
  </div>

  <!-- S5 : setlist -->
  <div id="s5" class="abs" style="inset:0">
    <div class="cap" id="s5c">Les chants du culte, dans&nbsp;l'ordre.</div>
    <div class="card" id="s5card" style="left:110px;top:270px;width:860px;height:760px">
      <div id="s5head" class="abs" style="left:0;top:0;width:860px;height:0;overflow:hidden"></div>
      <div id="s5rows"></div>
    </div>
  </div>

  <!-- S6 : mode louange -->
  <div id="s6" class="abs" style="inset:0">
    <div id="s6c" class="abs" style="left:56px;top:370px;width:540px;font-weight:700;font-size:66px;line-height:1.08;letter-spacing:-0.025em">Et le dimanche,<br><span style="color:var(--brand)">le Mode Louange.</span></div>
    <div class="phone" id="s6p" style="left:610px;top:50px;width:430px">
      <div class="screen" style="height:930px;border-radius:44px">
        <img id="s6a" src="shots/06-louange-barre.png" class="abs" style="width:430px;left:0;top:0">
        <img id="s6b" src="shots/06-louange-c.png" class="abs" style="width:430px;left:0;top:0">
        <div id="s6ring" class="abs" style="border-radius:999px;border:5px solid var(--brand)"></div>
      </div>
    </div>
  </div>

  <!-- S7 : fin -->
  <div id="s7" class="abs" style="inset:0">
    <img id="s7logo" src="../../public/logo.png" class="abs" style="width:200px;height:200px;left:440px;top:180px;border-radius:50%;box-shadow:0 18px 50px rgba(207,42,32,.25)">
    <div id="s7t" class="abs" style="left:0;right:0;top:430px;text-align:center;font-weight:700;font-size:120px;letter-spacing:-0.035em">C'est parti.</div>
    <div id="s7bar" class="abs" style="left:140px;top:680px;width:800px;height:141px;overflow:hidden;border-radius:72px;box-shadow:0 24px 60px rgba(28,28,30,.18)">
      <img src="shots/01-liste.png" class="abs" style="width:862px;left:-31px;top:-1693px">
    </div>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const ramp=(t,a,b)=>cl((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3);               // ease-out cubic
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const back=x=>{const c=1.4;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const S=[[0,2.5],[2.5,5],[5,10],[10,12.5],[12.5,15],[15,17.5],[17.5,99]];
// Entrée sur 0,45 s après le début, sortie sur les 0,28 s avant la fin (rien en double exposition).
function vis(t,i){const [a,b]=S[i];if(t<a||t>=b)return 0;const out=i===6?1:1-ramp(t,b-.28,b);return Math.min(1,out)}
function enter(t,i,d=0,len=.45){return eo(ramp(t,S[i][0]+d,S[i][0]+d+len))}
function leave(t,i){const b=S[i][1];return i===6?0:eio(ramp(t,b-.28,b))}
function show(id,o,dy=0,sc=1){const e=$(id);e.style.opacity=o;e.style.transform=`translateY(${dy}px) scale(${sc})`}

// Rangées de la setlist (CSS du 390 px : en-tête 375–430, rangées de 73,75 px à partir de 432).
const SC=860/390, Y0=375;
$("s5head").style.height=(432-Y0)*SC+"px";
$("s5head").innerHTML=`<img src="shots/05-setlist.png" class="abs" style="width:${SC*390}px;left:0;top:${-Y0*SC}px">`;
for(let i=0;i<4;i++){const top=432+73.75*i;const d=document.createElement("div");d.id="row"+i;d.className="abs";
  d.style.cssText=`left:0;top:${(top-Y0)*SC}px;width:860px;height:${73.75*SC+1}px;overflow:hidden;background:#fff`;
  d.innerHTML=`<img src="shots/05-setlist.png" class="abs" style="width:${SC*390}px;left:0;top:${-top*SC}px">`;$("s5rows").appendChild(d)}

window.render=function(t){
  // Halos qui dérivent doucement (fond de .panneau-marque).
  $("h1").style.transform=`translate(${-260+40*Math.sin(t*.35)}px,${-260+30*Math.cos(t*.3)}px)`;
  $("h2").style.transform=`translate(${580+40*Math.cos(t*.3)}px,${700+30*Math.sin(t*.4)}px)`;

  // S1
  let v=vis(t,0); $("s1").style.display=v?"block":"none";
  if(v){const l=leave(t,0);
    const p=back(ramp(t,0.05,0.6)); $("s1logo").style.opacity=cl(ramp(t,0.05,0.3))*(1-l);
    $("s1logo").style.transform=`scale(${.6+.4*p}) translateY(${-30*l}px)`;
    show("s1t",enter(t,0,.3)*(1-l),40*(1-enter(t,0,.3))-30*l);
    show("s1s",enter(t,0,.75)*(1-l),30*(1-enter(t,0,.75))-30*l);}

  // S2
  v=vis(t,1); $("s2").style.display=v?"block":"none";
  if(v){const l=leave(t,1),e=enter(t,1,0,.5);
    show("s2c",enter(t,1,.05,.35)*(1-l),30*(1-enter(t,1,.05,.35))-20*l);
    $("s2p").style.top=(310+640*(1-e)-40*l)+"px"; $("s2p").style.opacity=1-l;
    const s=eio(ramp(t,3.2,4.9)); $("s2img").style.top=(-s*1500)+"px";}

  // S3
  v=vis(t,2); $("s3").style.display=v?"block":"none";
  if(v){const l=leave(t,2),e=enter(t,2,0,.5);
    show("s3c",enter(t,2,.05,.35)*(1-l),30*(1-enter(t,2,.05,.35))-20*l);
    $("s3card").style.opacity=e*(1-l); $("s3card").style.transform=`translateY(${60*(1-e)-30*l}px)`;
    // Toucher sur « + » (CSS 246,86 → ×760/390, décalé de 78).
    const k=760/390, px=246*k, py=86*k-100, T=6.25;
    const r=ramp(t,T-.12,T+.45); $("s3r").style.cssText=`left:${px-(20+60*r)}px;top:${py-(20+60*r)}px;width:${40+120*r}px;height:${40+120*r}px;opacity:${t<T-.12?0:(1-r)}`;
    $("s3b").style.opacity=ramp(t,T,T+.14);
    const c=back(ramp(t,T+.05,T+.45)); const co=cl(ramp(t,T+.05,T+.2))*(1-ramp(t,7.7,7.95));
    $("s3chip").style.cssText=`left:${px-150}px;top:${py+80}px;opacity:${co};transform:scale(${.7+.3*c})`;
    // Puis on s'approche du couplet (CSS ~ 250–470) pour lire les accords.
    const z=eio(ramp(t,7.6,8.6)), Z=1+.4*z;
    $("s3zoom").style.transform=`translate(${-28*z}px,${-560*z}px) scale(${Z})`;}

  // S4
  v=vis(t,3); $("s4").style.display=v?"block":"none";
  if(v){const l=leave(t,3),e=enter(t,3,0,.5);
    show("s4c",enter(t,3,.05,.35)*(1-l),30*(1-enter(t,3,.05,.35))-20*l);
    $("s4card").style.opacity=e*(1-l); $("s4card").style.transform=`translateY(${60*(1-e)-30*l}px)`;
    const p=eio(ramp(t,10.3,12.3)); const H=780*1575/1098;
    $("s4img").style.transform=`translateY(${-p*(H-760)*.7}px) scale(${1+.04*p})`;}

  // S5
  v=vis(t,4); $("s5").style.display=v?"block":"none";
  if(v){const l=leave(t,4),e=enter(t,4,0,.5);
    show("s5c",enter(t,4,.05,.35)*(1-l),30*(1-enter(t,4,.05,.35))-20*l);
    $("s5card").style.opacity=e*(1-l); $("s5card").style.transform=`translateY(${60*(1-e)-30*l}px)`;
    $("s5card").style.height=((432-Y0)*SC+4*73.75*SC+10)+"px";
    for(let i=0;i<4;i++){const a=12.5+.3125*(i+1)+.15;const q=eo(ramp(t,a,a+.35));
      const r=$("row"+i); r.style.opacity=q; r.style.transform=`translateX(${80*(1-q)}px)`;}}

  // S6
  v=vis(t,5); $("s6").style.display=v?"block":"none";
  if(v){const l=leave(t,5),e=enter(t,5,0,.5);
    show("s6c",enter(t,5,.05,.4)*(1-l),30*(1-enter(t,5,.05,.4))-20*l);
    $("s6p").style.opacity=1-l; $("s6p").style.transform=`translateY(${(1-e)*600-30*l}px)`;
    // L'anneau sur « Ensuite : … » (CSS ~ 104–286 × 790–822 dans le 390×844).
    // Page suivante d'un glissé (sur le temps, 16,25 s), puis l'anneau sur « Ensuite : 十架的大能 ».
    const k=430/390, sw=eio(ramp(t,16.1,16.45));
    $("s6a").style.transform=`translateX(${-430*sw}px)`; $("s6b").style.transform=`translateX(${430*(1-sw)}px)`;
    const pu=back(ramp(t,16.55,16.9));
    $("s6ring").style.cssText=`border-radius:999px;border:5px solid #cf2a20;box-sizing:border-box;left:${104*k-8}px;top:${790*k-8}px;width:${182*k+16}px;height:${42*k+16}px;opacity:${cl(ramp(t,16.55,16.7))*(1-ramp(t,17.15,17.35))};transform:scale(${.85+.15*pu})`;}

  // S7
  v=vis(t,6); $("s7").style.display=v?"block":"none";
  if(v){const p=back(ramp(t,17.55,18.1)); $("s7logo").style.opacity=ramp(t,17.55,17.8);
    $("s7logo").style.transform=`scale(${.6+.4*p})`;
    show("s7t",enter(t,6,.25),40*(1-enter(t,6,.25)));
    const b=enter(t,6,.6,.5); show("s7bar",b,50*(1-b));}
};
window.ready=Promise.all([document.fonts.ready,...[...document.images].map(i=>i.decode().catch(()=>{}))]).then(()=>true);
</script></body></html>
