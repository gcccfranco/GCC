<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<!-- Extraits des cartes de la visite (16:9, 5 s, en boucle, sans légende) : une « caméra » sur les captures du vrai
     site. render-extraits.mjs injecte window.CFG = { device, boxes, clip } ; chaque image est render(t), avec
     render(0) === render(5) pour une boucle sans saut. -->
<style>
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#fff}
#cam{position:absolute;inset:0;overflow:hidden;background:#fff}
.abs{position:absolute}
img{display:block;max-width:none}
.ripple{position:absolute;border-radius:50%;border:5px solid #3f63cf;box-sizing:border-box}
.ring{position:absolute;border:4px solid #cf2a20;box-sizing:border-box;border-radius:18px}
.type{position:absolute;font-family:Inter,sans-serif;color:#1c1c1e;white-space:pre}
</style></head>
<body><div id="cam"><div id="monde" class="abs" style="left:0;top:0;transform-origin:0 0"></div></div>
<script>
const CFG = window.CFG ?? { device: "telephone", boxes: {}, clip: "tonalite" };
const D = CFG.device, B = CFG.boxes, VP = B.viewport, SH = `shots/${D}/`, CLIP = CFG.clip;
const W = 1280, H = 720, DUREE = 5;
const monde = document.getElementById("monde");
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ramp = (t, a, b) => cl((t - a) / (b - a));
const eio = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const lerp = (a, b, p) => a + (b - a) * p;
const el = (tag, cls, css, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (css) e.style.cssText = css; if (html) e.innerHTML = html; monde.appendChild(e); return e; };
/** Une capture posée dans le « monde », en px CSS de la page (largeur = largeur de la vue). */
const capture = (nom, largeur = VP.width, op = 1) => { const i = el("img", "abs", `left:0;top:0;width:${largeur}px;opacity:${op}`); i.src = SH + nom + ".png"; return i; };
/** La caméra : fenêtre de largeur w (px CSS), coin (x, y) ; hauteur w × 9/16. */
const camera = (x, y, w) => { const k = W / w; monde.style.transform = `scale(${k}) translate(${-x}px,${-y}px)`; };
const ripple = () => el("div", "ripple", "opacity:0");
function toucher(r, cx, cy, t, T) {
  const p = ramp(t, T - 0.1, T + 0.45), s = 14 + 40 * p;
  r.style.cssText = `left:${cx - s / 2}px;top:${cy - s / 2}px;width:${s}px;height:${s}px;border-width:${2.5}px;opacity:${t < T - 0.1 ? 0 : 1 - p}`;
}
const centre = (b) => [b.x + b.width / 2, b.y + b.height / 2];
let render;

if (CLIP === "tonalite") {
  // Musicien : « + » (G → Ab), on descend voir les accords, on remonte, « − » (Ab → G).
  const pl = B.pilule, it = B.intro, cp = B.couplet;
  const x0 = Math.min(pl.x, it.x) - 14, x1 = Math.max(pl.x + pl.width, it.x + it.width) + 14, w = x1 - x0, h = w * 9 / 16;
  const yHaut = Math.max(0, pl.y - 14), yBas = Math.min(it.y - 14, cp.y + cp.height + 14 - h);
  capture("02-chant"); const ab = capture("03-chant-plus1", VP.width, 0);
  const r = ripple(); const [px, py] = centre(B.plus); const [mx, my] = centre(B.moins ?? { x: pl.x + 2, y: pl.y + 2, width: 36, height: 36 });
  render = (t) => {
    const d = eio(ramp(t, 1.4, 2.1)) - eio(ramp(t, 3.1, 3.8));
    camera(x0, lerp(yHaut, Math.max(yHaut, yBas), d), w);
    ab.style.opacity = ramp(t, 1.0, 1.12) * (1 - ramp(t, 4.1, 4.22));
    if (t < 2.5) toucher(r, px, py, t, 0.95); else toucher(r, mx, my, t, 4.05);
  };
} else if (CLIP === "jianpu") {
  // Choriste : la page 简谱 transposée, parcourue de haut en bas puis remontée.
  const J = B.jianpu, w = J.width, h = w * 9 / 16, bas = Math.max(0, J.height - h);
  capture("04-jianpu-page", J.width);
  render = (t) => camera(0, bas * (eio(ramp(t, 0.3, 2.4)) - eio(ramp(t, 2.8, 4.8))), w);
} else if (CLIP === "setlist") {
  // Présidence, régie : les chants du culte arrivent un à un, restent, puis s'effacent.
  const R = B.rows;
  const r0 = Math.min(...R.map((r) => r.x)) - 12, r1 = Math.max(...R.map((r) => r.x + r.width)) + 12;
  const ry0 = Math.min(...R.map((r) => r.y)) - 14, ry1 = Math.max(...R.map((r) => r.y + r.height)) + 14;
  const w = Math.min(r1 - r0, VP.width, 520), h = w * 9 / 16, bas = Math.max(ry0, ry1 - h);
  capture("05-setlist");
  el("div", "abs", `left:${r0}px;top:${ry0}px;width:${r1 - r0}px;height:${ry1 - ry0}px;background:#fff`);
  const bandes = R.map((r, i) => {
    const top = i === 0 ? ry0 : r.y, bot = i === R.length - 1 ? ry1 : R[i + 1].y;
    const d = el("div", "abs", `left:${r0}px;top:${top}px;width:${r1 - r0}px;height:${bot - top}px;overflow:hidden;background:#fff`);
    const im = document.createElement("img"); im.src = SH + "05-setlist.png"; im.style.cssText = `position:absolute;width:${VP.width}px;left:${-r0}px;top:${-top}px`; d.appendChild(im);
    return d;
  });
  render = (t) => { camera(r0, lerp(ry0, bas, eio(ramp(t, 0.6, 3.0)) * (1 - eio(ramp(t, 4.2, 4.9)))), w); bandes.forEach((b, i) => {
    const a = 0.35 + 0.3 * i, q = eio(ramp(t, a, a + 0.35)) * (1 - ramp(t, 4.2, 4.7));
    b.style.opacity = q; b.style.transform = `translateX(${30 * (1 - eio(ramp(t, a, a + 0.35)))}px)`;
  }); };
} else if (CLIP === "chants") {
  // Membre : on tape « gloire » dans la recherche, les chants trouvés s'affichent, puis on revient à la liste.
  const S = B.recherche, Rz = B.resultat;
  const y0 = S.y - 18, y1 = Rz.y + Rz.height + 70, x0 = S.x - 18;
  const w = Math.min(Math.max(S.width + 36, 360), 520), h = w * 9 / 16, bas = Math.max(y0, y1 - h);
  capture("07-recherche-a"); const b = capture("07-recherche-b", VP.width, 0);
  const masque = el("div", "abs", `left:${S.x + 40}px;top:${S.y + 8}px;width:${S.width - 80}px;height:${S.height - 16}px;background:#fff;opacity:0`);
  const texte = el("div", "type", `left:${S.x + 42}px;top:${S.y + S.height / 2 - 10}px;font-size:16px;line-height:20px;opacity:0`);
  const r = ripple(); const [sx, sy] = centre(S);
  render = (t) => {
    camera(x0, lerp(y0, bas, eio(ramp(t, 1.9, 2.6)) * (1 - eio(ramp(t, 4.1, 4.7)))), w);
    toucher(r, sx, sy, t, 0.5);
    const n = Math.floor(cl((t - 0.8) / 0.12, 0, 6)), tape = t >= 0.8 && t < 1.75;
    masque.style.opacity = tape ? 1 : 0; texte.style.opacity = tape ? 1 : 0; texte.textContent = "gloire".slice(0, n);
    b.style.opacity = ramp(t, 1.6, 1.8) * (1 - ramp(t, 4.2, 4.6));
  };
} else if (CLIP === "taches") {
  // Équipe, référent : une case touchée deux fois (en cours, puis faite : la tâche part dans « Terminées »).
  const T = B.taches, C = B.caseTache;
  const w = Math.max(Math.min(T.width + 16, 460), (T.height + 24) * 16 / 9), h = w * 9 / 16;
  capture("08-taches-a"); const b = capture("08-taches-b", VP.width, 0); const c = capture("08-taches-c", VP.width, 0);
  const r = ripple(); const [kx, ky] = centre(C);
  camera(T.x - 8 - (w - Math.min(T.width + 16, 460)) / 2 * (T.width > 460 ? 0 : 1), T.y + T.height / 2 - h / 2, w);
  render = (t) => {
    toucher(r, kx, ky, t, t < 2 ? 1.0 : 2.4);
    const fin = ramp(t, 4.2, 4.7);
    b.style.opacity = ramp(t, 1.05, 1.17) * (1 - ramp(t, 2.45, 2.57));
    c.style.opacity = ramp(t, 2.45, 2.57) * (1 - fin);
  };
} else if (CLIP === "louange") {
  // Musicien : en Mode Louange, page suivante d'un glissé, on descend jusqu'à « Ensuite : … », retour.
  const E = B.ensuite, w = Math.min(VP.width, 620), h = w * 9 / 16;
  const bas = E ? cl(E.y + E.height + 24 - h, 0, VP.height - h) : Math.max(0, VP.height - h);
  const droite = E ? cl(E.x + E.width / 2 - w / 2, 0, VP.width - w) : 0;
  const a = capture("06-louange-a"), b = capture("06-louange-b");
  const ring = el("div", "ring", "opacity:0");
  render = (t) => {
    const sw = eio(ramp(t, 0.8, 1.2)) * (1 - eio(ramp(t, 4.3, 4.7)));
    a.style.transform = `translateX(${-VP.width * sw}px)`; b.style.transform = `translateX(${VP.width * (1 - sw)}px)`;
    const d = eio(ramp(t, 1.5, 2.3)) * (1 - eio(ramp(t, 3.6, 4.3)));
    camera(droite * d, bas * d, w);
    if (E) ring.style.cssText = `left:${E.x - 5}px;top:${E.y - 5}px;width:${E.width + 10}px;height:${E.height + 10}px;border-radius:${(E.height + 10) / 2}px;border-width:2.5px;opacity:${ramp(t, 2.3, 2.5) * (1 - ramp(t, 3.4, 3.6))}`;
  };
} else if (CLIP === "fin") {
  // C'est parti : la barre de navigation, un anneau passe sur chaque entrée.
  const N = B.nav, horizontal = D === "telephone" || D === "tablette";
  const n = 5;
  const w = horizontal ? N.width + 60 : Math.max(N.width + 300, (N.height + 80) * 16 / 9), h = w * 9 / 16;
  capture("01-liste");
  const ring = el("div", "ring", "");
  if (horizontal) camera(N.x - 30, N.y + N.height / 2 - h * 0.78, w);
  else camera(Math.max(0, N.x - 14), N.y + N.height / 2 - h / 2, w);
  render = (t) => {
    const i = Math.min(n - 1, Math.floor(t / (DUREE / n))), p = (t % (DUREE / n)) / (DUREE / n);
    const op = ramp(p, 0, 0.15) * (1 - ramp(p, 0.85, 1));
    if (horizontal) {
      const iw = N.width / n;
      ring.style.cssText = `left:${N.x + iw * i + 3}px;top:${N.y + 3}px;width:${iw - 6}px;height:${N.height - 6}px;border-radius:${(N.height - 6) / 2}px;border-width:2.5px;opacity:${op}`;
    } else {
      const ih = N.height / n;
      ring.style.cssText = `left:${N.x - 2}px;top:${N.y + ih * i}px;width:${N.width + 4}px;height:${ih}px;border-radius:10px;border-width:2.5px;opacity:${op}`;
    }
  };
}
window.render = render;
window.ready = Promise.all([document.fonts.ready, ...[...document.images].map((i) => i.decode().catch(() => {}))]).then(() => true);
</script></body></html>
